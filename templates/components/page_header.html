<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold mb-1">

            {{ page_title }}

        </h2>

        <p class="text-muted mb-0">

            {{ page_description }}

        </p>

    </div>

    {% if add_url %}

    <a href="{{ add_url }}"
       class="btn btn-primary">

        <i class="fas fa-plus me-2"></i>

        {{ add_button }}

    </a>

    {% endif %}

</div>
