<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | Smart Bus</title>
</head>
<body style="margin:0;background:#eef3f6;color:#172b4d;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="background:#123c59;color:#ffffff;padding:24px 28px;">
                            <p style="margin:0 0 8px;font-size:14px;">Smart Bus Charter</p>
                            <h1 style="margin:0;font-size:26px;">{{ title }}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px 28px;font-size:16px;line-height:1.5;">
                            <p style="margin:0 0 12px;">Hi {{ customer_name }},</p>
                            <p style="margin:0 0 20px;">{{ message }}</p>
                            <table width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7f9;font-size:14px;">
                                {% for label, value in trip_details %}
                                    <tr>
                                        <th scope="row" style="padding:9px 12px;text-align:left;vertical-align:top;color:#38526a;">{{ label }}</th>
                                        <td style="padding:9px 12px;overflow-wrap:anywhere;">{{ value }}</td>
                                    </tr>
                                {% endfor %}
                            </table>
                            <p style="margin:24px 0 0;">
                                <a href="{{ bookings_url }}" style="display:inline-block;background:#126c60;border-radius:6px;color:#ffffff;padding:10px 18px;font-weight:bold;text-decoration:none;">Open My Bookings</a>
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
